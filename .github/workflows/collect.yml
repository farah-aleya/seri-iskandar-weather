name: Collect weather

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes (GitHub may delay a few minutes)
  workflow_dispatch:          # lets you start a run by hand from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Open-Meteo data
        run: python collector/collect.py
        continue-on-error: true   # a failed fetch is still logged in data/runs.csv

      - name: Build dashboard data and SQLite database
        run: python analysis/build.py

      - name: Save collected data to the repository
        run: |
          git config user.name "weather-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
